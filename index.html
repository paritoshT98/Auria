<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10161D">
<title>Auria — Appointment Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;500&family=Noto+Sans+Oriya:wght@400;500;600&family=Noto+Serif+Oriya:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --ink:#10161D; --ink-2:#161E27; --ink-3:#1E2833; --ink-deep:#090D12;
    --line: rgba(237,231,218,0.08); --line-2: rgba(237,231,218,0.15);
    --linen:#EDE7DA; --linen-2:#F7F3EA;
    --linen-dim: rgba(237,231,218,0.68); --linen-faint: rgba(237,231,218,0.42);
    --brass:#B08D57; --brass-light:#E2C99A; --brass-deep:#7E6238; --brass-dim: rgba(176,141,87,0.14);
    --gold: linear-gradient(135deg,#F3E2BD 0%,#D4B27A 40%,#B08D57 66%,#8A6B3F 100%);
    --sage:#8AA391; --rose:#C1666B; --aqua:#7AA8B4;
    --f-display:'Fraunces','Noto Serif Devanagari','Noto Serif Oriya',Georgia,serif;
    --f-body:'Inter','Noto Sans Devanagari','Noto Sans Oriya',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --ease: cubic-bezier(.22,.68,0,1);
    --col: 440px;
    --hdrh: 60px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ background: var(--ink-deep); -webkit-text-size-adjust:100%; }
  body{
    margin:0; min-height:100svh; overflow-x:hidden;
    font-family: var(--f-body); color: var(--linen); line-height:1.5;
    background:
      radial-gradient(60vw 60vw at 12% 0%, rgba(176,141,87,0.10), transparent 60%),
      radial-gradient(50vw 50vw at 90% 100%, rgba(122,168,180,0.07), transparent 60%),
      var(--ink-deep);
    background-attachment: fixed;
  }
  ::selection{ background: var(--brass); color:#1A140A; }
  :focus-visible{ outline:2px solid var(--brass-light); outline-offset:3px; border-radius:10px; }
  button{ font:inherit; color:inherit; }
  .tap{ appearance:none; -webkit-appearance:none; border:0; background:none; padding:0; margin:0; text-align:inherit; cursor:pointer; }
  svg{ overflow:visible; }

  /* ---------- Page column (a real webpage, phone-width) ---------- */
  .app{
    position:relative; max-width: var(--col); margin: 0 auto; min-height:100svh;
    background: var(--ink);
  }

  /* ---------- Header ---------- */
  .hdr{
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; gap:10px;
    padding: env(safe-area-inset-top) 16px 0; height: calc(60px + env(safe-area-inset-top));
    background: rgba(16,22,29,0.74);
    -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px);
    border-bottom: 1px solid var(--line);
    transition: background .35s ease, border-color .35s ease;
  }
  .hdr.clear{ background: rgba(16,22,29,0); border-color: transparent; -webkit-backdrop-filter:none; backdrop-filter:none; }
  .iconbtn{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(237,231,218,0.06); border:1px solid var(--line-2);
  }
  .iconbtn svg{ width:16px; height:16px; stroke: var(--linen); }
  .iconbtn[hidden]{ display:none; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .mono{ width:30px; height:30px; border-radius:50%; padding:1px; background: var(--gold); flex-shrink:0; }
  .mono span{
    width:100%; height:100%; border-radius:50%; background: var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-style:italic; font-size:15px; color: var(--brass-light);
  }
  .brand .word{ font-family:'Fraunces',serif; font-style:italic; font-size:20px; letter-spacing:0.01em; color: var(--linen-2); }
  .spacer{ flex:1; }

  .lang{ position:relative; }
  .lang-btn{
    height:38px; padding: 0 12px 0 11px; border-radius:19px;
    display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:500; color: var(--linen-2);
    background: rgba(237,231,218,0.06); border:1px solid var(--line-2);
  }
  .lang-btn svg{ width:15px; height:15px; stroke: var(--brass-light); }
  .lang-btn .chev{ width:12px; height:12px; stroke: var(--linen-faint); transition: transform .25s var(--ease); }
  .lang-btn[aria-expanded="true"] .chev{ transform: rotate(180deg); }
  .lang-menu{
    position:absolute; right:0; top: calc(100% + 8px); min-width:200px; padding:6px;
    border-radius:18px; background: rgba(24,32,41,0.92); border:1px solid var(--line-2);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: 0 24px 50px -20px rgba(0,0,0,0.8);
    transform-origin: top right; animation: pop .22s var(--ease);
  }
  .lang-menu[hidden]{ display:none; }
  @keyframes pop{ from{ opacity:0; transform: scale(.95) translateY(-4px); } to{ opacity:1; transform:none; } }
  .lang-opt{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding: 11px 12px; border-radius:12px; font-size:15px; color: var(--linen-2);
  }
  .lang-opt small{ display:block; font-size:12px; color: var(--linen-faint); margin-top:1px; }
  .lang-opt:hover{ background: rgba(237,231,218,0.06); }
  .lang-opt svg{ width:16px; height:16px; stroke: var(--brass-light); opacity:0; }
  .lang-opt[aria-selected="true"] svg{ opacity:1; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; top: calc(var(--hdrh) + 12px); z-index:300;
    transform: translate(-50%, -10px); opacity:0; pointer-events:none;
    padding: 11px 18px; border-radius:14px; max-width: calc(min(100vw, var(--col)) - 40px);
    background: var(--linen-2); color:#141A21; font-size:13.5px; font-weight:600; text-align:center;
    box-shadow: 0 18px 36px -12px rgba(0,0,0,0.6);
    transition: opacity .28s ease, transform .28s var(--ease);
  }
  .toast.show{ opacity:1; transform: translate(-50%, 0); }

  /* ---------- Screen shell ---------- */
  .screen{ min-height: calc(100svh - var(--hdrh)); display:flex; flex-direction:column; animation: screenIn .55s var(--ease); }
  .screen.instant{ animation:none; }
  @keyframes screenIn{ from{ opacity:0; transform: translateY(14px); } to{ opacity:1; transform:none; } }

  .rv{ opacity:0; transform: translateY(18px); transition: opacity .8s var(--ease), transform .9s var(--ease); transition-delay: var(--d, 0ms); }
  .rv.in{ opacity:1; transform:none; }

  .ptitle{ padding: 18px 22px 4px; }
  .ptitle h1{ font-family: var(--f-display); font-weight:400; font-size:34px; line-height:1.08; letter-spacing:-0.02em; margin:0; color: var(--linen-2); }
  .ptitle .sub{ font-size:14.5px; color: var(--linen-faint); margin-top:8px; line-height:1.45; }
  .pbody{ padding: 18px 22px 24px; display:flex; flex-direction:column; gap:18px; }

  .glass{
    background: linear-gradient(155deg, rgba(40,51,64,0.72), rgba(20,27,35,0.72));
    border:1px solid var(--line-2); border-radius:24px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 26px 50px -30px rgba(0,0,0,0.75);
  }
  .banner{ position:relative; height:150px; overflow:hidden; }
  .banner-svg{ position:absolute; inset:0; width:100%; height:100%; }
  .banner-cap{ position:absolute; left:20px; bottom:18px; }
  .banner-cap .bc-t{ font-family: var(--f-display); font-size:22px; color: var(--linen-2); }
  .banner-cap .bc-s{ font-size:13px; color: var(--linen-dim); margin-top:2px; display:flex; align-items:center; }

  /* ---------- Buttons ---------- */
  .btn{
    position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:8px;
    height:56px; width:100%; border-radius:16px; border:none; cursor:pointer;
    font-family: var(--f-body); font-size:16px; font-weight:600; letter-spacing:0.005em;
    transition: transform .15s ease, box-shadow .3s ease, opacity .2s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{
    background: var(--gold); color:#1A140A;
    box-shadow: 0 14px 34px -14px rgba(212,178,122,0.65), inset 0 1px 0 rgba(255,255,255,0.45);
  }
  .btn-primary::after{
    content:''; position:absolute; top:0; bottom:0; width:40%; left:-60%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-18deg); transition: left .8s var(--ease);
  }
  .btn-primary:hover::after{ left:120%; }
  .btn-primary:disabled{ opacity:0.35; pointer-events:none; box-shadow:none; }
  .btn-pill{ width:auto; padding: 0 28px; height:52px; border-radius:26px; }
  .btn-outline{ background: transparent; color: var(--brass-light); border:1px solid rgba(212,178,122,0.45); }
  .btn-sm{ height:46px; font-size:14.5px; border-radius:23px; width:auto; padding: 0 22px; }

  .bar{
    position:sticky; bottom:0; z-index:20; margin-top:auto;
    display:flex; align-items:center; gap:16px;
    padding: 18px 22px calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(16,22,29,0.98) 62%, rgba(16,22,29,0));
  }
  .bar .price{ font-size:12.5px; color: var(--linen-faint); white-space:nowrap; }
  .bar .amt{ font-family: var(--f-display); font-size:24px; color: var(--linen-2); line-height:1.1; }
  .bar .btn{ flex:1; }

  /* ---------- Inputs ---------- */
  .field{ display:flex; flex-direction:column; gap:8px; }
  .field label{ font-size:13.5px; color: var(--linen-dim); font-weight:500; }
  .input, .tel{
    height:56px; width:100%; border-radius:16px; border:1px solid var(--line-2);
    background: rgba(22,30,39,0.85); color: var(--linen-2);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .input{ padding: 0 16px; font: 500 16px var(--f-body); outline:none; }
  .input::placeholder, .tel input::placeholder{ color: var(--linen-faint); font-weight:400; }
  .input:focus, .tel:focus-within{ border-color: var(--brass); box-shadow: 0 0 0 4px rgba(176,141,87,0.16); }
  .tel{ display:flex; align-items:stretch; overflow:hidden; }
  .tel .cc{
    display:flex; align-items:center; gap:8px; padding: 0 14px 0 16px; flex-shrink:0;
    border-right:1px solid var(--line-2); font-weight:600; font-size:16px; color: var(--linen-2);
    background: rgba(237,231,218,0.03); user-select:none;
  }
  .tel .cc svg{ width:22px; height:15px; border-radius:3px; }
  .tel input{
    flex:1; min-width:0; border:0; outline:none; background:transparent; color: var(--linen-2);
    padding: 0 14px; font: 500 17px var(--f-body); letter-spacing:0.06em;
  }
  .hint-txt{ font-size:13px; color: var(--linen-faint); line-height:1.55; margin:0; }
  .textarea{
    width:100%; min-height:90px; border-radius:14px; border:1px solid var(--line-2);
    background: rgba(22,30,39,0.85); color: var(--linen-2); padding: 13px 15px;
    font: 15px/1.5 var(--f-body); resize:vertical; outline:none;
  }
  .textarea:focus{ border-color: var(--brass); box-shadow: 0 0 0 4px rgba(176,141,87,0.16); }

  /* ---------- Avatars / portraits ---------- */
  .avatar{
    border-radius:50%; overflow:hidden; flex-shrink:0; position:relative;
    box-shadow: 0 0 0 1.5px rgba(226,201,154,0.7);
  }
  .avatar svg, .avatar img{ width:100%; height:100%; display:block; object-fit:cover; }
  .avatar.initials{ display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-style:italic; color:#1A140A; background: var(--gold); }

  /* ---------- Shared svg animation helpers ---------- */
  .ping{ transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
  @keyframes ping{ 0%{ transform: scale(.55); opacity:.7; } 80%,100%{ transform: scale(1.7); opacity:0; } }
  .ecg-run{ stroke-dasharray: .24 .76; animation: run 2.8s linear infinite; }
  @keyframes run{ from{ stroke-dashoffset: 1; } to{ stroke-dashoffset: 0; } }
  .draw{ stroke-dasharray:1; stroke-dashoffset:1; animation: draw 2.4s var(--ease) forwards; animation-delay: var(--d, .2s); }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .instant .draw{ animation:none; stroke-dashoffset:0; }
  .svgt{ font-family: var(--f-body); }
  .svgd{ font-family: var(--f-display); }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-7px); } }
  @keyframes beat{ 0%,100%{ transform: scale(1); } 12%{ transform: scale(1.18); } 24%{ transform: scale(1); } 36%{ transform: scale(1.1); } 48%{ transform: scale(1); } }

  /* ================= LANDING ================= */
  .sc{ position:relative; }
  .sc > .pin{
    position:sticky; top: var(--hdrh); height: calc(100svh - var(--hdrh));
    overflow:hidden; display:flex; flex-direction:column;
  }
  #sc-hero{ height: 170svh; }
  .glow{
    position:absolute; left:-15%; right:-15%; top:28%; aspect-ratio:1; border-radius:50%; pointer-events:none;
    background: radial-gradient(closest-side, rgba(212,178,122,0.30), rgba(212,178,122,0.07) 55%, transparent 74%);
    opacity:.6;
  }
  .hero-copy{ position:relative; z-index:3; padding: clamp(14px, 4svh, 40px) 26px 0; text-align:center; will-change: transform, opacity; }
  .hero-copy h1{
    margin:0; font-family: var(--f-display); font-weight:300; font-variation-settings:'opsz' 144;
    font-size: clamp(42px, 12.5vw, 58px); line-height:1.0; letter-spacing:-0.03em;
    background: linear-gradient(180deg, #FFFBF3 30%, #E6DAC4 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: screenIn 1.1s var(--ease) both;
  }
  .hero-copy p{ margin: 16px auto 0; max-width: 32ch; font-size:16px; line-height:1.55; color: var(--linen-dim); animation: screenIn 1.1s .12s var(--ease) both; }
  .hero-actions{ margin-top: 22px; display:flex; justify-content:center; animation: screenIn 1.1s .24s var(--ease) both; }
  .hero-art{ position:relative; z-index:2; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding: 8px 0 30px; will-change: transform; }
  .hero-art .steth{ height:100%; max-height:430px; width:auto; max-width:90%; }
  .fwrap{ position:absolute; z-index:4; will-change: transform, opacity; }
  .fcard{
    display:flex; align-items:center; gap:10px; padding: 9px 14px 9px 9px; border-radius:20px;
    background: rgba(26,34,44,0.66); border:1px solid var(--line-2);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 22px 44px -22px rgba(0,0,0,0.8); animation: bob 6s ease-in-out infinite;
  }
  .fc-t{ font-size:13px; font-weight:600; color: var(--linen-2); white-space:nowrap; }
  .fc-s{ font-size:11.5px; color: var(--brass-light); white-space:nowrap; }
  .okdot{ width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; background: rgba(138,163,145,0.18); border:1px solid rgba(138,163,145,0.5); }
  .okdot svg{ width:16px; height:16px; stroke: #A9C2B0; }
  .scroll-hint{ position:absolute; z-index:5; left:24px; bottom:14px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; font-size:12px; color: var(--linen-faint); }
  .scroll-hint i{ width:1px; height:26px; background: linear-gradient(var(--brass-light), transparent); animation: drip 2s ease-in-out infinite; transform-origin: top; }
  @keyframes drip{ 0%{ transform: scaleY(0); opacity:1; } 60%{ transform: scaleY(1); opacity:1; } 100%{ transform: scaleY(1); opacity:0; } }
  .particles span{ position:absolute; z-index:1; opacity:.35; animation: drift 14s ease-in-out infinite; }
  .particles svg{ width:100%; height:100%; stroke: var(--brass-light); }
  @keyframes drift{ 0%,100%{ transform: translate(0,0) rotate(0); } 50%{ transform: translate(10px,-22px) rotate(45deg); } }
  .beat{ transform-box: fill-box; transform-origin:center; animation: beat 1.3s ease-in-out infinite; }
  .chest-ring{ transform-box: fill-box; transform-origin:center; animation: ping 2.4s ease-out infinite; }

  .sec-h{ margin:0; font-family: var(--f-display); font-weight:400; font-size: clamp(30px, 8.6vw, 38px); line-height:1.08; letter-spacing:-0.02em; color: var(--linen-2); }

  /* pulse scene */
  #sc-pulse{ height: 240svh; }
  .pulse-pin{ padding: 34px 24px 26px; justify-content:center; gap: 26px; }
  .lit .w{ opacity:.14; transition: opacity .3s linear; }
  .lit .w.on{ opacity:1; }
  .ecg-wrap{ margin: 0 -24px; }
  .ecg{ width:100%; height:auto; display:block; }
  .readout{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .bpm{ display:flex; align-items:baseline; gap:8px; }
  .bpm svg{ width:26px; height:26px; fill: var(--rose); align-self:center; animation: beat 1.3s ease-in-out infinite; }
  .bpm b, .spo b{ font-family: var(--f-display); font-weight:300; font-size:60px; line-height:1; color: var(--linen-2); font-variant-numeric: tabular-nums; }
  .bpm span, .spo span{ font-size:13px; color: var(--linen-faint); }
  .spo{ text-align:right; }
  .spo b{ font-size:34px; display:block; }
  .fade-p{ margin:0; font-size:16px; line-height:1.6; color: var(--linen-dim); opacity:0; transform: translateY(12px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
  .fade-p.on{ opacity:1; transform:none; }

  /* steps scene */
  #sc-steps{ height: 380svh; }
  .steps-pin{ padding: 30px 22px 22px; }
  .stage{ position:relative; margin-top: 22px; height: min(40svh, 320px); overflow:hidden; border-radius:30px; }
  .ill{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; transform: scale(.93); transition: opacity .6s var(--ease), transform .9s var(--ease); }
  .ill.on{ opacity:1; transform:none; }
  .ill > svg{ width:100%; height:100%; }
  .ill .route{ stroke-dasharray:1; stroke-dashoffset:1; transition: stroke-dashoffset 1.4s var(--ease) .3s; }
  .ill.on .route{ stroke-dashoffset:0; }
  .ill .chk{ stroke-dasharray:1; stroke-dashoffset:1; transition: stroke-dashoffset .9s var(--ease) .35s; }
  .ill.on .chk{ stroke-dashoffset:0; }
  .ill .dg{ opacity:0; transition: opacity .3s ease; }
  .ill.on .dg{ opacity:1; }
  .ill .tapripple{ opacity:0; }
  .ill.on .tapripple{ opacity:1; }
  .spin-slow{ transform-box: fill-box; transform-origin:center; animation: spin 24s linear infinite; }
  .stxt{ position:relative; margin-top: 24px; min-height: 104px; }
  .stxt > div{ position:absolute; inset:0; opacity:0; transform: translateY(12px); transition: opacity .5s var(--ease), transform .6s var(--ease); }
  .stxt > div.on{ opacity:1; transform:none; }
  .stxt h3{ margin:0; font-family: var(--f-display); font-weight:400; font-size:26px; color: var(--linen-2); }
  .stxt p{ margin: 8px 0 0; font-size:15.5px; line-height:1.55; color: var(--linen-dim); max-width: 34ch; }
  .bars{ margin-top:auto; display:flex; gap:6px; }
  .bars i{ flex:1; height:3px; border-radius:2px; background: var(--line-2); overflow:hidden; position:relative; }
  .bars b{ position:absolute; inset:0; background: var(--gold); transform-origin: left; transform: scaleX(0); }

  /* care scene */
  #sc-care{ height: 210svh; }
  .care-pin{ padding: 20px 24px 28px; }
  .helix-wrap{ flex: 1 1 44%; min-height:0; display:flex; align-items:center; justify-content:center; }
  .helix-wrap svg{ height:100%; max-height:320px; width:auto; }
  .care-pin .sec-h{ margin-top: 8px; }
  .assures{ margin-top: 18px; }
  .assure{ display:flex; align-items:center; gap:14px; padding: 14px 0; border-top: 1px solid var(--line); opacity:0; transform: translateY(12px); transition: opacity .6s var(--ease), transform .7s var(--ease); }
  .assure.on{ opacity:1; transform:none; }
  .assure .aic{ width:40px; height:40px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background: var(--brass-dim); border:1px solid rgba(212,178,122,0.25); }
  .assure .aic svg{ width:18px; height:18px; stroke: var(--brass-light); }
  .assure span{ font-size:15px; color: var(--linen); line-height:1.4; }

  /* specialties */
  .specs{ padding: 90px 0 50px; overflow:hidden; }
  .specs-head{ padding: 0 24px; }
  .specs-head p{ margin: 12px 0 0; font-size:16px; line-height:1.6; color: var(--linen-dim); max-width:34ch; }
  .track{ display:flex; gap:14px; padding: 30px 24px 6px; will-change: transform; }
  .tile{ flex: 0 0 214px; padding: 20px; border-radius:26px; position:relative; overflow:hidden; }
  .tile .ticon{ width:58px; height:58px; border-radius:18px; display:flex; align-items:center; justify-content:center; background: rgba(9,13,18,0.5); border:1px solid var(--line-2); }

  var MAP_BASE = { w:640, h:420, minW:180 };
  var mapView = { x:0, y:0, w:640, h:420 };
  var mapJustDragged = false;
  function clampMapView(){
    mapView.w = clamp(mapView.w, MAP_BASE.minW, MAP_BASE.w);
    mapView.h = mapView.w * (MAP_BASE.h / MAP_BASE.w);
    mapView.x = clamp(mapView.x, 0, MAP_BASE.w - mapView.w);
    mapView.y = clamp(mapView.y, 0, MAP_BASE.h - mapView.h);
  }
  function applyMapView(svg){ svg.setAttribute('viewBox', mapView.x.toFixed(1) + ' ' + mapView.y.toFixed(1) + ' ' + mapView.w.toFixed(1) + ' ' + mapView.h.toFixed(1)); }
  function zoomMap(svg, factor, cx, cy){
    var ow = mapView.w, oh = mapView.h;
    if(cx === undefined){ cx = mapView.x + ow / 2; cy = mapView.y + oh / 2; }
    var nw = clamp(ow * factor, MAP_BASE.minW, MAP_BASE.w), nh = nw * (MAP_BASE.h / MAP_BASE.w);
    mapView.x = cx - (cx - mapView.x) * (nw / ow);
    mapView.y = cy - (cy - mapView.y) * (nh / oh);
    mapView.w = nw; mapView.h = nh;
    clampMapView(); applyMapView(svg);
  }

  /* =========================================================
     SCROLL ENGINE (Apple-style, scroll-linked)
     ========================================================= */
  var scenes = [], ticking = false, hdrH = 60, helixState = null;
  function addScene(el, mode, fn){ if(el) scenes.push({ el:el, mode:mode, fn:fn }); }
  function requestTick(){ if(!ticking){ ticking = true; requestAnimationFrame(tick); } }
  function tick(){
    ticking = false;
    var vh = window.innerHeight;
    scenes.forEach(function(s){
      var r = s.el.getBoundingClientRect();
      if(r.bottom < -50 || r.top > vh + 50) return;
      var p;
      if(s.mode === 'pin'){
        var total = r.height - (vh - hdrH);
        p = total > 0 ? clamp((hdrH - r.top) / total) : 0;
      } else {
        p = clamp((vh - r.top) / (vh + r.height));
      }
      s.fn(p);
    });
    var hdr = document.getElementById('hdr');
    hdr.classList.toggle('clear', S.screen === 'splash' && window.scrollY < 12);
  }
  window.addEventListener('scroll', requestTick, { passive:true });
  window.addEventListener('resize', function(){ measureHeader(); requestTick(); });

  function measureHeader(){
    hdrH = document.getElementById('hdr').offsetHeight || 60;
    document.documentElement.style.setProperty('--hdrh', hdrH + 'px');
  }

  function setupLanding(root){
    /* hero */
    var copy = root.querySelector('#h-copy'), art = root.querySelector('#h-art'), glow = root.querySelector('#h-glow');
    var ca = root.querySelector('#h-ca'), cb = root.querySelector('#h-cb'), hint = root.querySelector('#h-hint');
    addScene(root.querySelector('#sc-hero'), 'pin', function(p){
      var e = easeOut(p);
      copy.style.opacity = 1 - clamp(p / 0.4);
      hint.style.opacity = 1 - clamp(p / 0.08);
      ca.style.opacity = cb.style.opacity = 1 - clamp((p - 0.25) / 0.35);
      art.style.opacity = 1 - clamp((p - 0.78) / 0.22);
      glow.style.opacity = 0.6 + 0.4 * e;
      if(!RM){
        copy.style.transform = 'translateY(' + (-50 * p) + 'px) scale(' + (1 - 0.1 * p) + ')';
        art.style.transform = 'translateY(' + (-70 * e) + 'px) scale(' + (1 + 0.42 * e) + ') rotate(' + (-8 * e) + 'deg)';
        ca.style.transform = 'translate(' + (-70 * e) + 'px,' + (-40 * e) + 'px)';
        cb.style.transform = 'translate(' + (60 * e) + 'px,' + (50 * e) + 'px)';
        glow.style.transform = 'scale(' + (1 + 0.5 * e) + ')';
      }
    });

    /* pulse / ECG */
    var wordsEls = root.querySelectorAll('#p-title .w');
    var line = root.querySelector('#ecg-line'), glowLine = root.querySelector('#ecg-glow');
    var dot = root.querySelector('#ecg-dot'), halo = root.querySelector('#ecg-halo');
    var bpm = root.querySelector('#p-bpm'), spo = root.querySelector('#p-spo'), pbody = root.querySelector('#p-body');
    var len = line.getTotalLength();
    addScene(root.querySelector('#sc-pulse'), 'pin', function(p){
      wordsEls.forEach(function(w, i){ w.classList.toggle('on', p > 0.02 + (i / wordsEls.length) * 0.32); });
      var q = clamp((p - 0.1) / 0.62), qe = easeOut(q);
      line.style.strokeDashoffset = glowLine.style.strokeDashoffset = (1 - q).toFixed(4);
      var pt = line.getPointAtLength(len * q);
      dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
      halo.setAttribute('cx', pt.x); halo.setAttribute('cy', pt.y);
      halo.style.opacity = dot.style.opacity = q > 0.001 && q < 0.999 ? 1 : 0;
      bpm.textContent = Math.round(72 * qe);
      spo.textContent = Math.round(98 * qe) + '%';
      pbody.classList.toggle('on', p > 0.6);
    });

    /* steps */
    var ills = root.querySelectorAll('.ill'), txts = root.querySelectorAll('.stxt > div'), bars = root.querySelectorAll('.bars b');
    var lastStep = 0;
    addScene(root.querySelector('#sc-steps'), 'pin', function(p){
      var f = p * 4, idx = Math.min(3, Math.floor(f));
      bars.forEach(function(b, i){ b.style.transform = 'scaleX(' + clamp(f - i).toFixed(3) + ')'; });
      if(idx !== lastStep){
        lastStep = idx;
        ills.forEach(function(el, i){ el.classList.toggle('on', i === idx); });
        txts.forEach(function(el, i){ el.classList.toggle('on', i === idx); });
      }
    });

    /* care / DNA helix */
    var hx = root.querySelector('#hx'), NS = 'http://www.w3.org/2000/svg', rungs = [], N = 15;
    for(var i = 0; i < N; i++){
      var ln = document.createElementNS(NS, 'line'), a = document.createElementNS(NS, 'circle'), b = document.createElementNS(NS, 'circle');
      ln.setAttribute('stroke', 'rgba(226,201,154,0.35)'); ln.setAttribute('stroke-width', '1.5');
      a.setAttribute('fill', '#E2C99A'); b.setAttribute('fill', '#8AA391');
      hx.appendChild(ln); hx.appendChild(a); hx.appendChild(b);
      rungs.push({ ln:ln, a:a, b:b, y: 22 + i * 18.2 });
    }
    var strandA = document.createElementNS(NS, 'path'), strandB = document.createElementNS(NS, 'path');
    strandA.setAttribute('fill', 'none'); strandA.setAttribute('stroke', 'url(#gGold)'); strandA.setAttribute('stroke-width', '2.2'); strandA.setAttribute('stroke-linecap', 'round');
    strandB.setAttribute('fill', 'none'); strandB.setAttribute('stroke', 'rgba(138,163,145,0.75)'); strandB.setAttribute('stroke-width', '2.2'); strandB.setAttribute('stroke-linecap', 'round');
    hx.insertBefore(strandB, hx.firstChild); hx.insertBefore(strandA, hx.firstChild);
    var ctitle = root.querySelector('#c-title'), assures = root.querySelectorAll('.assure'), careScroll = 0;
    function drawHelix(phase){
      var da = '', db = '';
      for(var k = 0; k <= 56; k++){
        var yy = 22 + k * (18.2 * (N - 1) / 56), ang2 = phase + (k / 56) * (N - 1) * 0.5, s2 = Math.sin(ang2);
        da += (k ? 'L' : 'M') + (150 + 62 * s2).toFixed(1) + ',' + yy.toFixed(1);
        db += (k ? 'L' : 'M') + (150 - 62 * s2).toFixed(1) + ',' + yy.toFixed(1);
      }
      strandA.setAttribute('d', da); strandB.setAttribute('d', db);
      rungs.forEach(function(r, i){
        var ang = phase + i * 0.5, s = Math.sin(ang), z = Math.cos(ang);
        var x1 = 150 + 62 * s, x2 = 150 - 62 * s;
        r.ln.setAttribute('x1', x1.toFixed(1)); r.ln.setAttribute('x2', x2.toFixed(1));
        r.ln.setAttribute('y1', r.y); r.ln.setAttribute('y2', r.y);
        r.a.setAttribute('cx', x1.toFixed(1)); r.a.setAttribute('cy', r.y); r.a.setAttribute('r', (5 + 2.2 * z).toFixed(2));
        r.a.setAttribute('opacity', (0.5 + 0.5 * (z + 1) / 2).toFixed(2));
        r.b.setAttribute('cx', x2.toFixed(1)); r.b.setAttribute('cy', r.y); r.b.setAttribute('r', (5 - 2.2 * z).toFixed(2));
        r.b.setAttribute('opacity', (0.5 + 0.5 * (1 - z) / 2).toFixed(2));
      });
    }
    helixState = { visible:false, drift:0, draw: drawHelix, scroll:0, t0:0 };
    drawHelix(0);
    var careEl = root.querySelector('#sc-care');
    addScene(careEl, 'pin', function(p){
      helixState.scroll = p * Math.PI * 3;
      if(RM) drawHelix(helixState.scroll);
      if(!RM) hx.setAttribute('transform', 'rotate(' + (-22 + 30 * p).toFixed(2) + ' 150 150)');
      ctitle.style.opacity = clamp((p - 0.04) / 0.2);
      if(!RM) ctitle.style.transform = 'translateY(' + (20 * (1 - clamp((p - 0.04) / 0.2))) + 'px)';
      assures.forEach(function(el, i){ el.classList.toggle('on', p > 0.28 + i * 0.14); });
    });
    if(!RM && 'IntersectionObserver' in window){
      new IntersectionObserver(function(ents){
        if(!helixState) return;
        helixState.visible = ents[0].isIntersecting;
        if(helixState.visible && !helixState.running){ helixState.running = true; requestAnimationFrame(helixLoop); }
      }).observe(careEl);
    }

    /* specialties marquee */
    var track = root.querySelector('#s-track');
    addScene(root.querySelector('#sc-specs'), 'pass', function(p){
      if(RM) return;
      var max = track.scrollWidth - track.parentElement.clientWidth;
      track.style.transform = 'translateX(' + (40 - p * (max + 80)).toFixed(1) + 'px)';
    });
  }

  function helixLoop(ts){
    if(!helixState || !helixState.visible || S.screen !== 'splash'){ if(helixState) helixState.running = false; return; }
    helixState.draw(helixState.scroll + ts / 2600);
    requestAnimationFrame(helixLoop);
  }

  var revealIO = null;
  function setupReveals(root, instant){
    var els = root.querySelectorAll('.rv');
    if(instant || RM || !('IntersectionObserver' in window)){ els.forEach(function(e){ e.classList.add('in'); }); return; }
    if(revealIO) revealIO.disconnect();
    revealIO = new IntersectionObserver(function(ents){
      ents.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); revealIO.unobserve(en.target); } });
    }, { rootMargin:'0px 0px -6% 0px' });
    els.forEach(function(e){ revealIO.observe(e); });
  }

  /* =========================================================
     RENDER + NAVIGATION
     ========================================================= */
  var screensEl = document.getElementById('screens');
  var toastEl = document.getElementById('toast'), toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  function render(opts){
    opts = opts || {};
    var keepY = opts.keepScroll ? window.scrollY : 0;
    scenes = [];
    if(helixState) helixState.visible = false;
    helixState = null;
    screensEl.innerHTML = R[S.screen] ? R[S.screen]() : '';
    var root = screensEl;
    if(opts.keepScroll){
      var first = root.firstElementChild;
      if(first) first.classList.add('instant');
      root.querySelectorAll('.hero-copy h1, .hero-copy p, .hero-actions').forEach(function(e){ e.style.animation = 'none'; });
      root.classList.add('instant');
    } else {
      root.classList.remove('instant');
    }
    document.getElementById('hdr-back').hidden = S.screen === 'splash';
    bind(root);
    if(S.screen === 'splash') setupLanding(root);
    setupReveals(root, opts.keepScroll);
    window.scrollTo(0, keepY);
    requestTick();
  }

  function go(screen, opts){
    opts = opts || {};
    if(!opts.replace) S.history.push(S.screen);
    S.screen = screen;
    render(opts);
  }
  function back(){
    S.screen = S.history.pop() || 'splash';
    render();
  }

     LANGUAGE

  var langBtn = document.getElementById('lang-btn'), langMenu = document.getElementById('lang-menu');
  function buildLangMenu(){
    var cur = LANGS.find(function(l){ return l.code === S.lang; });
    document.getElementById('lang-cur').textContent = cur.name;

  langBtn.addEventListener('click', function(e){ e.stopPropagation(); toggleLang(langMenu.hidden); });

  /* =========================================================
     EVENTS
     ========================================================= */
  function bind(root){
    root.querySelectorAll('[data-act]').forEach(function(el){
      el.addEventListener('click', function(ev){ handle(el.getAttribute('data-act'), el, ev); });
    });

    root.querySelectorAll('[data-bind]').forEach(function(inp){
      inp.addEventListener('input', function(){
        if(inp.hasAttribute('data-digits')){
          var dg = inp.value.replace(/\D/g, '');
          if(dg.length > 10 && dg.indexOf('91') === 0) dg = dg.slice(2);
          if(dg.length > 10 && dg.charAt(0) === '0') dg = dg.slice(1);
          inp.value = dg.slice(0, 10);
        }
        S[inp.getAttribute('data-bind')] = inp.value;
      });
    });

    var otp = root.querySelectorAll('.otp-d');
    otp.forEach(function(inp, i){
      inp.addEventListener('input', function(){
        var v = inp.value.replace(/\D/g, '');
        if(v.length > 1){
          v.split('').slice(0, 4 - i).forEach(function(ch, k){ otp[i + k].value = ch; });
          (otp[Math.min(3, i + v.length)] || inp).focus();
          return;
        }
        inp.value = v;
        if(v && otp[i + 1]) otp[i + 1].focus();
      });
      inp.addEventListener('keydown', function(e){ if(e.key === 'Backspace' && !inp.value && otp[i - 1]) otp[i - 1].focus(); });
    });

    var map = root.querySelector('#townmap');
    if(map){
      applyMapView(map);
      root.querySelectorAll('[data-map]').forEach(function(b){
        b.addEventListener('click', function(e){ e.stopPropagation(); zoomMap(map, b.getAttribute('data-map') === 'in' ? 0.72 : 1 / 0.72); });
      });
      map.addEventListener('wheel', function(e){
        if(!e.ctrlKey && !e.metaKey) return;
        e.preventDefault();
        var rect = map.getBoundingClientRect();
        zoomMap(map, e.deltaY < 0 ? 0.9 : 1 / 0.9, mapView.x + (e.clientX - rect.left) / rect.width * mapView.w, mapView.y + (e.clientY - rect.top) / rect.height * mapView.h);
      }, { passive:false });
      var drag = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0, pid = null;
      map.addEventListener('pointerdown', function(e){ drag = true; moved = false; mapJustDragged = false; sx = e.clientX; sy = e.clientY; ox = mapView.x; oy = mapView.y; pid = e.pointerId; });
      map.addEventListener('pointermove', function(e){
        if(!drag) return;
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if(moved || Math.abs(dx) > 4 || Math.abs(dy) > 4){
          if(!moved){ moved = true; try{ map.setPointerCapture(pid); }catch(err){} }
          var f = mapView.w / map.getBoundingClientRect().width;
          mapView.x = ox - dx * f; mapView.y = oy - dy * f;
          clampMapView(); applyMapView(map);
        }
      });
      var end = function(){ drag = false; if(moved) mapJustDragged = true; };
      map.addEventListener('pointerup', end);
      map.addEventListener('pointercancel', end);
      map.addEventListener('pointerleave', end);
    }

    var fee = root.querySelector('#admin-fee');
    if(fee){
      var feeLabel = root.querySelector('#admin-fee-label');
      fee.addEventListener('input', function(){
        feeLabel.textContent = '\u20b9' + fee.value;
        fee.style.setProperty('--fill', ((fee.value - 100) / 500 * 100) + '%');
      });
      fee.addEventListener('change', function(){ doc(S.adminDoctorId).fee = parseInt(fee.value, 10); saveStore(); });
    }

    var photo = root.querySelector('#admin-photo');
    if(photo){
      photo.addEventListener('change', function(){
        var file = photo.files && photo.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          var img = new Image();
          img.onload = function(){
            var c = document.createElement('canvas'), s = 320, sc = Math.max(s / img.width, s / img.height);
            c.width = c.height = s;
            c.getContext('2d').drawImage(img, (s - img.width * sc) / 2, (s - img.height * sc) / 2, img.width * sc, img.height * sc);
            captureAdminFields();
            doc(S.adminDoctorId).photo = c.toDataURL('image/jpeg', 0.85);
            saveStore();
            render({ keepScroll:true });
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
  }

  function captureAdminFields(){
    var d = doc(S.adminDoctorId), n = document.getElementById('admin-name');
    if(!d || !n) return;
    var s = document.getElementById('admin-spec'), b = document.getElementById('admin-bio');
    if(n.value.trim()) d.name[S.lang] = n.value.trim();
    if(s.value.trim()) d.spec[S.lang] = s.value.trim();

  function handle(act, el, ev){
    if(act === 'pick-clinic-map' && mapJustDragged){ mapJustDragged = false; return; }

    if(act === 'role-patient'){ S.selectedDoctorId = null; go('signinPatient'); return; }
    if(act === 'role-clinic'){ go('signinClinic'); return; }
    if(act === 'tile-doctor'){
      S.selectedDoctorId = el.getAttribute('data-id');
      S.selectedClinicId = doc(S.selectedDoctorId).clinicId;
      go('signinPatient'); return;
    }

    if(act === 'patient-continue'){
      var m = document.getElementById('p-mobile').value;
      if(!validMobile(m)){ toast(t('err_mobile')); document.getElementById('p-mobile').focus(); return; }
      S.bookingMobile = m;
      S.patientName = document.getElementById('p-name').value;
      if(S.selectedDoctorId && S.history[0] === 'splash' && S.history.length === 1){
        S.selectedDateKey = null; S.selectedSlot = null;
        go('doctor'); return;
      }
      go('location'); return;
    }
    if(act === 'clinic-continue'){
      toast(t('signed_in', { clinic: L(clinic(ADMIN_CLINIC).name) }));
      go('adminDashboard'); return;
    }

    if(act === 'pick-clinic' || act === 'pick-clinic-map'){
      S.selectedClinicId = el.getAttribute('data-id');
      go('clinicDetail'); return;
    }
    if(act === 'pick-doctor'){
      S.selectedDoctorId = el.getAttribute('data-id');
      S.selectedDateKey = null; S.selectedSlot = null;
      go('doctor'); return;
    }
    if(act === 'pick-date'){
      S.selectedDateKey = el.getAttribute('data-key');
      S.selectedSlot = null;
      go('doctor', { replace:true, keepScroll:true }); return;
    }
    if(act === 'pick-slot'){
      S.selectedSlot = { minutes: parseInt(el.getAttribute('data-min'), 10) };
      go('doctor', { replace:true, keepScroll:true }); return;
    }
    if(act === 'go-confirm'){ go('confirm'); return; }
    if(act === 'send-otp'){
      var cm = document.getElementById('confirm-mobile').value;
      if(!validMobile(cm)){ toast(t('err_mobile')); document.getElementById('confirm-mobile').focus(); return; }
      S.bookingMobile = cm;
      toast(t('demo_code'));
      go('otp'); return;
    }
    if(act === 'resend-otp'){ toast(t('demo_code')); return; }
    if(act === 'confirm-booking'){
      var code = Array.prototype.map.call(document.querySelectorAll('.otp-d'), function(i){ return i.value; }).join('');
      if(code.length < 4){ toast(t('err_otp_short')); return; }
      if(code !== '4821'){ toast(t('err_otp_wrong')); return; }
      S.history = [];
      go('success', { replace:true }); return;
    }
    if(act === 'restart'){
      S.selectedSlot = null; S.selectedDateKey = null; S.selectedDoctorId = null; S.history = [];
      go('splash', { replace:true }); return;
    }

    if(act === 'admin-signout'){ S.history = []; go('splash', { replace:true }); return; }
    if(act === 'admin-pick-doc'){ captureAdminFields(); S.adminDoctorId = el.getAttribute('data-id'); go('adminDashboard', { replace:true, keepScroll:true }); return; }
    if(act === 'admin-dur'){
      captureAdminFields();
      doc(S.adminDoctorId).duration = parseInt(el.getAttribute('data-v'), 10);
      saveStore();
      go('adminDashboard', { replace:true, keepScroll:true }); return;
    }
    if(act === 'admin-save'){
      captureAdminFields();
      var f = document.getElementById('admin-fee');
      if(f) doc(S.adminDoctorId).fee = parseInt(f.value, 10);
      saveStore();
      toast(t('saved'));
      render({ keepScroll:true });
      return;
    }
  }

  /* =========================================================
     BOOT
     ========================================================= */
  buildLangMenu();
  measureHeader();
  render();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ measureHeader(); requestTick(); });
})();
</script>
</body>
</html>
